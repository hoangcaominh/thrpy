edition = "2023";
package th16;

import "thdef.proto";
import "google/protobuf/timestamp.proto";

enum Shot {
    REIMUSPRING = 0;
    REIMUSUMMER = 1;
    REIMUAUTUMN = 2;
    REIMUWINTER = 3;
    REIMU = 4;
    CIRNOSPRING = 5;
    CIRNOSUMMER = 6;
    CIRNOAUTUMN = 7;
    CIRNOWINTER = 8;
    CIRNO = 9;
    AYASPRING = 10;
    AYASUMMER = 11;
    AYAAUTUMN = 12;
    AYAWINTER = 13;
    AYA = 14;
    MARISASPRING = 15;
    MARISASUMMER = 16;
    MARISAAUTUMN = 17;
    MARISAWINTER = 18;
    MARISA = 19;
}

message ReplayData {
    thdef.GameId game = 1;
    uint32 version = 2;
    Shot shot = 3;
    thdef.Difficulty difficulty = 4;
    uint64 score = 5;
    google.protobuf.Timestamp timestamp = 6;
    string name = 7;
    float slowdown = 8;
    repeated StageData stages = 100;
}

message StageData {
    thdef.Stage stage = 1;
    uint64 score = 2;
    uint32 graze = 3;
    uint32 piv = 4;
    uint32 power = 5;
    uint32 lives = 6;
    uint32 life_pieces = 7;
    uint32 bombs = 8;
    uint32 bomb_pieces = 9;
    uint32 season_power = 10;
}
